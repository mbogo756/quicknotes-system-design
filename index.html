<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>QuickNotes API Client</header>
    <main>
        <button id="load-btn" type="button">Load notes</button>
        <p id="status" role="status"></p>
        <ul id="notes-list"></ul>

        <form id="note-form">
            <label for="title-input">Title</label>
            <input
              type="text"
              id="title-input"
              placeholder="Enter note title"
              >
              <label for="body-input">Note body</label>
              <textarea
                id="body-input"
                placeholder="Enter note content"
                ></textarea>
            <button type="submit" id="submit-btn">Add Note</button>
        </form>
    </main>
</body>
</html>
